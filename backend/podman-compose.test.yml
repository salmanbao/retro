version: '3.8'

# ViralForge Integration Test Environment
# Usage: podman-compose -f podman-compose.test.yml up -d

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: viralforge-test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: integration_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d integration_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional: Test server for integration tests
  # Uncomment and configure if running full integration tests
  # api_test:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.test
  #   container_name: viralforge-test-api
  #   environment:
  #     DATABASE_URL: postgres://test:test@postgres_test:5432/integration_test
  #     BASE_URL: http://localhost:8080
  #     ENCRYPTION_KEY: test-encryption-key-32-bytes!!
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres_test:
  #       condition: service_healthy
  #   restart: unless-stopped

networks:
  default:
    name: viralforge-test-networks